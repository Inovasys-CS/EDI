title: VeeamBackup Database Credentials Dump Via Psql.EXE
id: 7e2c1f6a-9d3b-4a2e-8c5f-1a9b6e4d7f21
status: experimental
description: Detects dump of credentials from the VeeamBackup PostgreSQL database "credentials" table using psql.exe, potentially indicating credential theft from a Veeam Backup Server
references:
    - https://thedfirreport.com/2021/12/13/diavol-ransomware/
    - https://forums.veeam.com/veeam-backup-replication-f2/recover-esxi-password-in-veeam-t34630.html
author: Inovasys_Manar_Mamdouh
Date: 2025-08-15
tags:
    - attack.collection
    - attack.t1005
logsource:
    category: process_creation
    product: windows
detection:
    selection_tools:
        Image|endswith: '\psql.exe'
    selection_query:
        CommandLine|contains|all:
            - 'SELECT'
            - 'VeeamBackup'
    condition: all of selection_*
falsepositives:
    - Unknown
level: high
