title: Msxsl.EXE Execution
id: 9e50a8b3-dd05-4eb8-9153-bdb6b79d50b0
status: test
description: |
    Detects the execution of the MSXSL utility. This can be used to execute
    Extensible Stylesheet Language (XSL) files. These files are commonly used
    to describe the processing and rendering of data within XML files.
    Adversaries can abuse this functionality to execute arbitrary files while
    potentially bypassing application whitelisting defenses.
author: Timur Zinniatullin, oscd.community
date: 2019-10-21
modified: 2023-11-09
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1220/T1220.md
    - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Msxsl/
tags:
    - inovasys.public
    - attack.defense_evasion
    - attack.t1220
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\msxsl.exe'
    condition: selection
falsepositives:
    - Msxsl is not installed by default and is deprecated, so unlikely on most systems.
level: medium
