title: BumbleBee AdaptixC2 Akira
description: A collection of rules that aim to detect behaviors and artifacts observed in the BumbleBee, AdaptixC2, and Akira attack chain.
category: Report
date: 2026/06/29
company: The DFIR Report
reference: https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/
rules:
      * defense_evasion/System_File_Execution_Location_Anomaly
      * discovery/Advanced_IP_Scanner
      * defense_evasion/Wab_Execution_From_Non_Default_Location
      * defense_evasion/wab_unusual_parent_or_child_processes
      * discovery/password_provided_in_command_line_of_net_exe
      * persistence/new_user_created_via_net_exe_never_expire
      * persistence/new_user_created_via_net_exe
      * persistence/user_added_to_local_administrators_group
      * persistence/user_added_to_highly_privileged_group
      * command_and_control/net_conn_cloudflared_tunnels_domains
      * command_and_control/cloudflared_portable_execution
      * command_and_control/cloudflared_quick_tunnel_exe
      * command_and_control/cloudflared_tunnel_exe
      * credential_access/crackmapexec_process_patterns
      * discovery/recon_output_piped_to_findstr_exe
      * credential_access/pro_dump_via_comsvcs_dll
      * credential_access/comsvcs_lsass_dump_via_rundll32
      * defense_evasion/shadow_copies_deletion_using_os_utilities
      * credential_access/sensitive_file_dump_via_wbadmin_exe
      * exfiltration/filezilla_exe_from_uncommon_directory
      * collection/veeambackup_dump_via_psql_exe
      * command_and_control/rustdesk_execution
      * defense_evasion/potential_dll_side_loading_of_msimg32_dll
